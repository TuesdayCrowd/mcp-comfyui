name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC ID token authenticates with JSR. No secrets, no access token —
      # this only works once the package is linked to this repo in its JSR
      # settings (jsr.io/@tuesdaycrowd/mcp-comfyui -> Settings -> link repo).
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Populates node_modules for the Node-facing tooling (`tsc`, and
      # `scripts/build.mjs` itself, which runs under `node`). This was `npm ci`
      # until 0.6.0 deleted package.json; `deno install` reads the same
      # dependencies from deno.json's own `imports` and materialises them the
      # same way, because of `nodeModulesDir: "auto"`. Verified from a clean
      # room with node_modules and deno.lock both deleted.
      - run: deno install

      # Publishing a broken version is not undoable — JSR refuses to republish a
      # version number, so a bad one is spent. The gates run first for that
      # reason, not for tidiness.
      - name: Test
        run: deno task test

      - name: Typecheck
        run: deno task typecheck

      # `--no-check` is the same decision the Test step above already makes, for
      # the same measured reason: `deno check` has a known false-positive gap
      # against this project's @modelcontextprotocol/sdk + zod 4 combination —
      # it reports the SDK's own `registerTool` handler parameters as implicit
      # `any` (TS7006/TS7031) — while `tsc`, running on this project's own
      # TypeScript one step above, passes with zero errors. That step is the
      # authoritative gate and it runs first, in this same job, so nothing is
      # published without a real type-check having passed.
      #
      # Not merely tidiness: `npx jsr publish` downloads its OWN Deno rather
      # than using the version pinned above, so leaving the check on made an
      # irreversible step depend on whichever TypeScript that download happened
      # to carry. 0.5.0 published cleanly and 0.6.0 did not, on the same class
      # of code. `jsr publish` does not list this flag in `--help`; it passes
      # through to `deno publish`, verified locally against this repo.
      #
      # `jsr publish` is a no-op when deno.json's version is already published,
      # so pushing to main without bumping the version is safe and silent.
      - name: Publish to JSR
        run: npx jsr publish --no-check
